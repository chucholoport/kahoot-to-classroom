; ============================================================
; Project: Kahoot to Classroom
; Author: jesus.loport
; File: template.ini
; Purpose: Reference configuration file for course setup
; ============================================================
; Notes:
; - This file follows the INI format.
; - Each course/group should have its own .ini file.
; - File naming convention: <GROUP>_<COURSE>.ini
;   Example: ISW28_OPERATING_SYSTEMS.ini
; ============================================================

[course]
; course_id: Unique identifier of the course in Google Classroom.
; You can find it in the course URL:
;   https://classroom.google.com/c/1234567890123
; In this example, the course_id is 1234567890123.
course_id = 1234567890123

[certs]
; credentials: Path to the OAuth2 credentials file (.json).
; This file is generated in Google Cloud Console when you configure OAuth.
; Typically stored in the "certs/" directory at project root.
; Example: credentials/classroom_credentials.json
credentials = certs/classroom_credentials.json

[data]
; Path to the manual student list file (.txt).
; Must contain only student names, one per line, no blank lines or comments.
; File naming convention: <GROUP>.txt
; Example: ISW17.txt
student_list = data/ISW17.txt